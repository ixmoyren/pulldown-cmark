[package]
name = "pulldown-cmark-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition.workspace = true
rust-version.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
anyhow = "1"
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
pretty_assertions = "1.4.1"
quick-xml = "0.39.2"
boa_engine = { git = "https://github.com/boa-dev/boa.git" }
boa_runtime = { git = "https://github.com/boa-dev/boa.git", default-features = false }
boa_parser = { git = "https://github.com/boa-dev/boa.git" }
urlencoding = "2.1.2"

[dependencies.pulldown-cmark]
path = "../pulldown-cmark"

[features]
simd = ["pulldown-cmark/simd"]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false

[[bin]]
name = "commonmark_js"
path = "fuzz_targets/commonmark_js.rs"
test = false
doc = false
