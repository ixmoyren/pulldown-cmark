[package]
name = "dos-fuzzer"
version = "0.1.0"
authors = ["oberien <jaro.fietz@gmx.de>"]
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
itertools = "0.14.0"
walkdir = "2.5"
pulldown-cmark = { path = "../pulldown-cmark" }
ndarray = "0.17.2"
ndarray-stats = "0.7.0"
rand = "0.10.1"
rand_xoshiro = "0.8.0"
crossbeam-utils = "0.8"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getopts = { version = "0.2" }
