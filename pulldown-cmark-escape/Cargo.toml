[package]
name = "pulldown-cmark-escape"
version = "0.11.0"
authors = [
    "Raph Levien <raph.levien@gmail.com>",
    "Marcus Klaas de Vries <mail@marcusklaas.nl>",
]
license = "MIT"
description = "An escape library for HTML created in the pulldown-cmark project"
repository = "https://github.com/raphlinus/pulldown-cmark"
keywords = ["escape", "html", "markdown", "commonmark"]
categories = ["text-processing"]
edition.workspace = true
rust-version.workspace = true # Update README.md and GitHub action when changing this
readme = "./README.md"

[dependencies]
fearless_simd = { version = "0.4.0", optional = true }

[features]
simd = ["fearless_simd"]
std = []