[package]
name = "pulldown-cmark"
version = "0.14.0"
authors = [
    "Raph Levien <raph.levien@gmail.com>",
    "Marcus Klaas de Vries <mail@marcusklaas.nl>",
]
license = "MIT"
description = "A pull parser for CommonMark"
repository = "https://github.com/raphlinus/pulldown-cmark"
keywords = ["markdown", "commonmark"]
categories = ["text-processing"]
edition.workspace = true
rust-version.workspace = true # Update README.md, CONTRIBUTING.md, and GitHub action when changing this
readme = "../README.md"
exclude = [
    "/third_party/**/*",
    "/tools/**/*",
    "/specs/**/*",
    "/azure-pipelines.yml",
]

build = "build.rs"

[[bin]]
name = "pulldown-cmark"
required-features = ["getopts", "std"]
doc = false

[[example]]
name = "event-filter"
required-features = ["html"]
doc-scrape-examples = true

[[example]]
name = "footnote-rewrite"
required-features = ["html"]
doc-scrape-examples = true

[[example]]
name = "parser-map-event-print"
required-features = ["html"]
doc-scrape-examples = true

[[example]]
name = "parser-map-tag-print"
required-features = ["html"]
doc-scrape-examples = true

[[example]]
name = "string-to-string"
required-features = ["html"]
doc-scrape-examples = true

[[example]]
name = "broken-link-callbacks"
required-features = ["html"]
doc-scrape-examples = true

[[example]]
name = "normalize-wikilink"
required-features = ["html"]
doc-scrape-examples = true

[dependencies]
bitflags = "2.11.1"
unicase = "2.9"
memchr = { version = "2.8", default-features = false }
getopts = { version = "0.2", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
pulldown-cmark-escape = { path = "../pulldown-cmark-escape", version = "0.11", optional = true }
hashbrown = { version = "0.17", optional = true }

[dev-dependencies]
regex = "1.6"
serde_json = "1.0.61"
bincode = "1.3.3"

[features]
default = ["std", "getopts", "html"]
std = ["pulldown-cmark-escape?/std", "memchr/std"]
gen-tests = []
simd = ["pulldown-cmark-escape?/simd"]
html = ["pulldown-cmark-escape"]
hashbrown = ["dep:hashbrown"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rustbuild)'] }
